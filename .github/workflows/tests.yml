name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.14']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Provision development tools
        run: python -m pip install -e ".[dev]"
      - name: Offline common suite
        env:
          PIP_NO_INDEX: '1'
          PYTHONUTF8: '1'
        run: python -m pytest -q -p no:cacheprovider -m "not packaging"
      - name: Required isolated packaging gate
        env:
          PIP_NO_INDEX: '1'
          PYTHONUTF8: '1'
        run: python -m pytest -q -p no:cacheprovider -m packaging tests/test_packaging.py
      - name: Offline demonstration
        run: python examples/minimal_failure/run_demo.py --format json
